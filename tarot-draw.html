<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인연결 · 타로 카드뽑기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap');
:root{--bg:#0a0a1a;--panel:#12102a;--panel2:#1a1640;--line:#2a2555;--text:#f0eeff;--muted:#9e97c0;--accent:#c9a84c;--accent2:#e8d48b;--warn:#e8a855;--glow:#c9a84c33;--shadow:0 20px 60px #00001088;--glass:rgba(25,20,60,0.65);--glass-border:rgba(200,168,76,0.15)}

body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,#1e1545 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,#15102e 0%,transparent 50%),radial-gradient(circle at 50% 50%,#0d0b20 0%,#0a0a1a 100%);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.7;min-height:100vh}

.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}

.subtitle{color:var(--muted);max-width:520px;margin:0 auto 36px;font-size:15px;line-height:1.8}
.phase{display:none;animation:fadeUp .5s ease}.phase.active{display:block}

.draw-progress{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.draw-progress .dot{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .3s}

.result-card{background:linear-gradient(160deg,rgba(22,18,50,0.85),rgba(14,12,30,0.9));border:1px solid rgba(201,168,76,.25);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:24px 20px;text-align:left;width:100%;max-width:360px}
.result-card .position-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}

.result-card-img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.result-name{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:700;color:var(--accent2);text-align:center}
.result-name-en{font-size:10px;color:var(--muted);text-align:center;margin-top:2px}
.result-card .result-info h3{margin:0 0 6px;font-size:18px;color:var(--accent2);font-family:"Noto Serif KR",serif}
.result-card .result-num{font-size:11px;color:var(--muted);margin-bottom:6px}
.result-card .result-archetype{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:0}
.result-card .result-archetype span{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--accent2);padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
.result-card .result-desc{font-size:14px;line-height:1.8;color:#d8d0f0;margin:0 0 12px}
.result-card .result-advice{padding:12px 14px;border-radius:10px;background:rgba(77,168,112,.05);border:1px solid rgba(77,168,112,.12);font-size:13px;color:#c8f0d8;line-height:1.6}
.result-card .result-advice strong{color:#8ee0a8;font-size:11px;letter-spacing:.05em}

.summary-panel{background:linear-gradient(160deg,rgba(22,18,50,0.85),rgba(14,12,30,0.9));border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:24px;max-width:740px;margin:0 auto 20px;text-align:left}
.summary-panel h3{font-family:"Noto Serif KR",serif;font-size:18px;color:var(--accent2);margin:0 0 10px}
.summary-panel p{font-size:14px;color:#d8d0f0;line-height:1.8;margin:0}
.summary-insight{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(138,120,200,.06);border:1px solid rgba(138,120,200,.15);font-size:13px;color:#c8c0e8;line-height:1.7}
.btn-row{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 24px;font-weight:700;cursor:pointer;transition:filter .2s,box-shadow .2s;font-size:14px}
.btn-primary{background:linear-gradient(135deg,#c9a84c,#a88530,#c9a84c);color:#0e0a18;box-shadow:0 4px 20px rgba(201,168,76,.25);text-shadow:0 1px 0 rgba(255,255,255,.2)}
.btn-primary:hover{filter:brightness(1.12);box-shadow:0 6px 30px rgba(201,168,76,.35)}
.btn-ghost{background:rgba(25,20,55,0.6);color:#d0c8f0;border:1px solid #3a3568}
.btn-ghost:hover{border-color:var(--accent)}
.home-link{display:inline-block;margin-top:20px;color:var(--muted);font-size:13px;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.home-link:hover{color:var(--accent2);border-color:var(--accent2)}
.footer{color:#6a6290;font-size:12px;text-align:center;margin-top:30px;letter-spacing:.02em}
@media(max-width:600px){
  .cat-grid{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
  .cat-btn{padding:16px 8px 14px}.cat-btn .cat-icon{font-size:26px}.cat-btn .cat-name{font-size:13px}
  .tcard{width:72px;height:112px}.tcard-back::after{font-size:22px}.tcard-front .card-img{max-height:86px}.tcard-front .card-label{font-size:9px}
  .result-card{padding:18px 16px}.result-visual{width:110px;height:160px}.result-cards{gap:14px}
}
.back-home{position:fixed;top:16px;left:16px;z-index:100;display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;transition:border-color .2s,color .2s,background .2s}.back-home:hover{border-color:rgba(201,168,76,.4);color:var(--accent2);background:rgba(25,20,60,0.8)}.back-home svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
/* ── 인연결 Supabase Client ── */
/* ⚠️ 아래 URL과 KEY를 본인의 Supabase 프로젝트 값으로 교체하세요 */
const SUPABASE_URL='__SUPABASE_URL__';
const SUPABASE_KEY='__SUPABASE_ANON_KEY__';

const _sb=(SUPABASE_URL.startsWith('__'))?null:window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const InyeonDB={
  _ready:!!_sb,
  getDeviceId(){
    let id=null;
    try{id=localStorage.getItem('inyeon_device_id')}catch(e){}
    if(!id){
      id=crypto.randomUUID?crypto.randomUUID():
        'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
          const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)});
      try{localStorage.setItem('inyeon_device_id',id)}catch(e){}
    }
    return id;
  },

  async getProfile(){
    if(!_sb)return null;
    const{data,error}=await _sb.from('profiles').select('*')
      .eq('device_id',this.getDeviceId()).single();
    if(error&&error.code!=='PGRST116')console.error('getProfile:',error);
    return data;
  },

  async saveProfile(p){
    if(!_sb)return{data:null,error:{message:'Supabase 미설정'}};
    const{data,error}=await _sb.from('profiles')
      .upsert({...p,device_id:this.getDeviceId(),updated_at:new Date().toISOString()},
        {onConflict:'device_id'}).select().single();
    if(error)console.error('saveProfile:',error);
    return{data,error};
  },

  async deleteProfile(){
    if(!_sb)return false;
    const{error}=await _sb.from('profiles').delete()
      .eq('device_id',this.getDeviceId());
    return !error;
  },

  async saveHistory(entry){
    if(!_sb)return{data:null,error:{message:'Supabase 미설정'}};
    const{data,error}=await _sb.from('history')
      .insert({...entry,device_id:this.getDeviceId()}).select().single();
    if(error)console.error('saveHistory:',error);
    return{data,error};
  },

  async getHistory(type,limit=50){
    if(!_sb)return[];
    let q=_sb.from('history').select('id,content_type,title,input_summary,created_at')
      .eq('device_id',this.getDeviceId()).order('created_at',{ascending:false}).limit(limit);
    if(type)q=q.eq('content_type',type);
    const{data,error}=await q;
    if(error)console.error('getHistory:',error);
    return data||[];
  },

  async getHistoryDetail(id){
    if(!_sb)return null;
    const{data}=await _sb.from('history').select('*')
      .eq('id',id).eq('device_id',this.getDeviceId()).single();
    return data;
  },

  async deleteHistory(id){
    if(!_sb)return false;
    const{error}=await _sb.from('history').delete()
      .eq('id',id).eq('device_id',this.getDeviceId());
    return !error;
  }
};

</script>

<main class="app">
  <div class="eyebrow">✦ INYEON GYEOL · 인연결</div>
  <h1>타로 카드뽑기</h1>

  <!-- Phase 1: 대분류 선택 -->
  <div class="phase active" id="phase-topic">
    <p class="subtitle">어떤 이야기가 궁금하세요?<br>주제를 선택하면 맞는 카드를 준비해 드릴게요.</p>
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- Phase 2: 소분류 선택 -->
  <div class="phase" id="phase-sub">
    <div class="sub-header">
      <button class="back-btn" onclick="goPhase('topic')">← 주제 다시 선택</button>
      <h2 id="sub-title"></h2>
      <p id="sub-desc"></p>
    </div>
    <div class="sub-list" id="sub-list"></div>
  </div>

  <!-- Phase 3: 카드 뽑기 -->
  <div class="phase" id="phase-draw">
    <div class="draw-header">
      <button class="back-btn" onclick="goPhase('sub')">← 소분류 다시 선택</button>
      <div class="badge" id="draw-badge"></div>
    </div>
    <div class="draw-progress" id="draw-progress"></div>
    <p class="instruction" id="draw-instruction"></p>
    <div class="spread" id="spread"></div>
  </div>

  <!-- Phase 4: 결과 -->
  <div class="phase" id="phase-result">
    <div class="sub-header" style="margin-bottom:24px">
      <h2 id="result-title"></h2>
      <p id="result-sub-desc"></p>
    </div>
    <div class="result-cards" id="result-cards"></div>
    <div class="summary-panel" id="summary-panel" style="display:none">
      <h3>✦ 종합 리딩</h3>
      <p id="summary-text"></p>
      <div class="summary-insight" id="summary-insight" style="display:none"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="resetAll()">🔮 다른 주제 보기</button>
      <button class="btn btn-ghost" onclick="retrySame()">🔄 같은 주제 다시 뽑기</button>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <a href="tarot-daily.html" class="btn btn-ghost">☀️ 오늘의 타로</a>
      <a href="tarot-personal.html" class="btn btn-ghost">🃏 나만의 타로</a>
      <a href="saju-main.html" class="btn btn-ghost">🏠 메인으로</a>
    </div>
  </div>

  <div class="footer">타로 해석은 오락과 자기성찰을 위한 참고 결과이며 의료·법률·투자 판단을 대신하지 않습니다.</div>
</main>

<script>
/* ================================================================
   인연결 타로 SPA — 3축 해석 시스템 (카드 × 위치역할 × 주제맥락)
   해석 = f(카드, 위치역할, 주제맥락)
   ================================================================ */

/* ══════════════════════════════════════════════════════════════════
   메이저 아르카나 22장 — 3축 확장 데이터
   meanings: {general, love, career, money}
   position_hints: {time, perspective, action, situation, result}
   advice: {general, love, career, money}
   tone: p(positive) / c(challenging) / n(neutral)
   ══════════════════════════════════════════════════════════════════ */
const MAJOR=[
{id:0, name:'The Fool', nameKo:'바보', emoji:'🃏', archetype:['자유','시작','모험'], tone:'p', isMajor:true,
  meanings:{
    general:'새로운 시작과 무한한 가능성을 상징해요. 아직 정해진 것이 없기에 어디든 갈 수 있어요.',
    love:'예상치 못한 인연이 찾아오거나, 관계에서 완전히 새로운 감정이 시작되는 때예요.',
    career:'전혀 새로운 분야에 도전하거나, 기존의 틀을 벗어난 과감한 커리어 전환의 시기예요.',
    money:'계획보다 직감이 앞서는 시기예요. 새로운 수입원이 열릴 수 있지만 무모한 지출은 주의하세요.'
  },
  position_hints:{
    time:'완전히 새로운 출발점에 서 있어요. 과거와 단절된 새 에너지가 시작돼요.',
    perspective:'자유롭고 순수한 시선으로 상황을 바라보고 있어요. 편견 없는 눈이에요.',
    action:'두려움을 내려놓고 첫 발을 내딛는 것이 필요해요. 생각보다 행동이 먼저예요.',
    situation:'미지의 영역이라 불확실하지만, 그 불확실함 자체가 기회예요.',
    result:'예상 밖의 새로운 전개가 펼쳐질 거예요. 열린 마음으로 맞이하세요.'
  },
  advice:{
    general:'두려워하지 말고 첫 발을 내딛어 보세요.',

/* ══════════════════════════════════════════════════════════════════
   3축 해석 생성기 — generateReading(card, position, context)
   ══════════════════════════════════════════════════════════════════ */
function generateReading(card, positionLabel, topicContext){
  const ctx=topicContext||'general';
  const group=getPositionGroup(positionLabel);

  // 축 1: 카드 × 주제맥락 → 해석
  const meaning=card.meanings?card.meanings[ctx]||card.meanings.general||card.description:card.description||'';

  // 축 2: 카드 × 위치역할 → 뉘앙스
  const hint=card.position_hints?card.position_hints[group]||'':'';

  // 축 3: 카드 × 주제맥락 → 조언
  const advice=card.advice?card.advice[ctx]||card.advice.general||'':card.advice||'';

  return {meaning, hint, advice};
}

/* ══════════════════════════════════════════════════════════════════
   종합 리딩 생성 — buildSummary()
   카드 간 서사 + 심리적 통찰 + 실행 조언
   ══════════════════════════════════════════════════════════════════ */
function buildSummary(){
  const drawn=STATE.drawn;
  const cards=drawn.map(d=>d.card);
  const positions=drawn.map(d=>d.position);
  const ctx=STATE.category.context||'general';
  const majorCount=cards.filter(c=>c.isMajor).length;

  let parts=[];

  // 1. 메이저 비율 해석
  if(majorCount===cards.length&&cards.length>=2){
    parts.push('모든 카드가 메이저 아르카나예요. 이 질문은 당신의 인생에서 큰 의미를 가지는 흐름이에요.');
  } else if(majorCount>=2){
    parts.push('메이저 카드가 다수 나왔어요. 중요한 전환점에 가까이 있다는 신호예요.');
  }

  // 2. 슈트 집중도 (마이너 카드)
  const minors=cards.filter(c=>!c.isMajor);
  if(minors.length>=2){
    const suitCount={};
    minors.forEach(c=>{suitCount[c.suit]=(suitCount[c.suit]||0)+1;});
    const dominant=Object.entries(suitCount).sort((a,b)=>b[1]-a[1])[0];
    if(dominant&&dominant[1]>=2){
      const suitTheme=SUIT_META[dominant[0]].theme;
      parts.push(`${SUIT_META[dominant[0]].nameKo} 카드가 집중적으로 나왔어요. '${suitTheme}' 영역에 에너지가 모여 있어요.`);
    }
  }

  // 3. 톤 궤적 — 시작→끝 방향
  const tones=cards.map(c=>c.tone||'n');
  const toneLabel={p:'긍정',c:'도전',n:'중립'};
  if(cards.length>=3){
    const first=tones[0], last=tones[tones.length-1];
    if(first==='c'&&last==='p') parts.push('도전적인 상황에서 시작해 밝은 결말로 향하는 흐름이에요. 힘든 시기를 지나 좋아지고 있어요.');
    else if(first==='p'&&last==='c') parts.push('좋은 시작이지만 뒤로 갈수록 주의가 필요해요. 방심하지 않는 것이 중요해요.');
    else if(first==='p'&&last==='p') parts.push('시작부터 끝까지 긍정적인 에너지가 흐르고 있어요. 자신감을 가지세요.');
    else if(first==='c'&&last==='c') parts.push('전반적으로 도전적인 흐름이에요. 하지만 이 시련이 더 강해지는 계기가 될 거예요.');
  }

  // 4. 카드 간 서사 구성
  if(cards.length>=3){
    const firstReading=generateReading(cards[0],positions[0],ctx);
    const midReading=generateReading(cards[1],positions[1],ctx);
    const lastReading=generateReading(cards[cards.length-1],positions[positions.length-1],ctx);

    parts.push(`'${cards[0].nameKo}'에서 시작된 에너지가 '${cards[1].nameKo}'를 거쳐 '${cards[cards.length-1].nameKo}'로 이어지고 있어요.`);
  } else if(cards.length===2){
    parts.push(`'${cards[0].nameKo}'와 '${cards[1].nameKo}'의 에너지가 만나고 있어요.`);
  }

  // 5. 카드 조합 특별 해석
  const combos=detectCombos(cards);
  if(combos.length>0) parts.push(combos.join(' '));

  // 6. 최종 실행 조언 — 결과 위치 카드 또는 마지막 카드 기준
  const lastCard=cards[cards.length-1];
  const lastAdv=lastCard.advice?(lastCard.advice[ctx]||lastCard.advice.general):'';
  if(lastAdv) parts.push(lastAdv);

  return parts.join(' ');
}

/* 심리적 통찰 생성 */
function buildInsight(){
  const drawn=STATE.drawn;
  const cards=drawn.map(d=>d.card);
  const ctx=STATE.category.context||'general';

  if(cards.length<2) return '';

  let insights=[];

  // 대비 패턴: 긍정 ↔ 도전 카드 조합
  const hasBoth=cards.some(c=>c.tone==='p')&&cards.some(c=>c.tone==='c');
  if(hasBoth){
    const pos=cards.find(c=>c.tone==='p');
    const neg=cards.find(c=>c.tone==='c');
    if(ctx==='love') insights.push(`겉으로는 '${pos.nameKo}'처럼 긍정적인 면이 보이지만, 마음 깊은 곳에서는 '${neg.nameKo}'가 보여주는 불안이나 갈등도 함께 있어요.`);
    else if(ctx==='career') insights.push(`일에서 '${pos.nameKo}'의 가능성이 보이지만, '${neg.nameKo}'가 가리키는 현실적 도전도 직시해야 해요.`);
    else insights.push(`'${pos.nameKo}'의 밝은 에너지와 '${neg.nameKo}'의 도전적 에너지가 동시에 작용하고 있어요. 양면을 모두 인정하는 것이 중요해요.`);
  }

  // 반복 패턴: 비슷한 아키타입
  if(cards.length>=3){
    const allArchetypes=cards.flatMap(c=>c.archetype||[]);
    const archCount={};
    allArchetypes.forEach(a=>{archCount[a]=(archCount[a]||0)+1;});
    const repeated=Object.entries(archCount).filter(([k,v])=>v>=2).map(([k])=>k);
    if(repeated.length>0){
      insights.push(`'${repeated.join("', '")}'이라는 키워드가 반복되고 있어요. 지금 당신에게 가장 중요한 테마예요.`);
    }
  }

  return insights.join(' ');
}

/* 카드 조합 특별 해석 */
function detectCombos(cards){
  const ids=new Set(cards.map(c=>c.id));
  const combos=[];
  const COMBO_DICT={
    '16,17':'큰 변화 뒤에 희망이 보여요. 무너진 자리에 별빛이 비추고 있어요.',
    '6,15':'매력적이지만 의존적인 관계 패턴을 주의하세요.',
    '9,10':'혼자 고민하던 것에 전환점이 찾아와요.',
    '0,21':'여정의 시작과 완성이 동시에 보여요. 큰 사이클이 완성되고 있어요.',
    '13,17':'끝낸 것에서 새로운 희망이 피어나요.',
    '16,19':'혼란 뒤에 밝은 빛이 기다리고 있어요. 가장 어두운 밤이 지나면 해가 떠요.',
    '2,18':'직관은 강하지만 환상에 빠지지 않도록 주의하세요.',
    '7,8':'강한 의지와 인내심이 만나 어떤 어려움도 이겨낼 수 있어요.',
    '4,3':'질서와 풍요가 함께하는 안정적인 시기예요.',
    '11,20':'과거의 행동에 대한 결산이 이루어지고 있어요. 정직하게 마주하세요.',
  };
  for(const[key,msg] of Object.entries(COMBO_DICT)){
    const pair=key.split(',').map(Number);
    if(pair.every(id=>ids.has(id))){
      combos.push(msg);
    }
  }
  return combos;
}

/* ══════════════════════════════════════════════════════════════════
   SPA 상태 관리
   ══════════════════════════════════════════════════════════════════ */
const STATE={
  phase:'topic',
  category:null,
  subTopic:null,
  pool:[],
  shuffled:[],
  drawn:[],
  drawIdx:0,
};

/* 카드풀 빌더 */
function buildPool(poolType){
  if(poolType==='major') return [...MAJOR];
  const parts=poolType.split('+');
  let pool=[...MAJOR];
  if(parts.includes('cups'))      pool=pool.concat(MINOR.filter(c=>c.suit==='cups'));
  if(parts.includes('swords'))    pool=pool.concat(MINOR.filter(c=>c.suit==='swords'));
  if(parts.includes('pentacles')) pool=pool.concat(MINOR.filter(c=>c.suit==='pentacles'));
  if(parts.includes('wands'))     pool=pool.concat(MINOR.filter(c=>c.suit==='wands'));
  return pool;
}

/* 셔플 (Fisher–Yates) */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* 페이즈 전환 */
function goPhase(p){
  document.querySelectorAll('.phase').forEach(el=>el.classList.remove('active'));
  document.getElementById('phase-'+p).classList.add('active');
  STATE.phase=p;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* Phase 1: 대분류 렌더 */
function renderTopics(){
  const grid=document.getElementById('cat-grid');
  grid.innerHTML='';
  TOPICS.forEach(t=>{
    const div=document.createElement('div');
    div.className='cat-btn';
    div.innerHTML=`<span class="cat-icon">${t.icon}</span><div class="cat-name">${t.name}</div><div class="cat-desc">${t.desc}</div>`;
    div.addEventListener('click',()=>selectCategory(t));
    grid.appendChild(div);
  });
}

/* Phase 2: 소분류 렌더 */
function selectCategory(cat){
  STATE.category=cat;
  document.getElementById('sub-title').textContent=cat.icon+' '+cat.name;
  document.getElementById('sub-desc').textContent=cat.desc;
  const list=document.getElementById('sub-list');
  list.innerHTML='';
  cat.subs.forEach(s=>{
    const div=document.createElement('div');
    div.className='sub-btn';
    div.innerHTML=`<div><div class="sub-name">${s.name}</div><div class="sub-desc">${s.desc}</div></div><span class="sub-count">${s.count}장</span>`;
    div.addEventListener('click',()=>selectSub(s));
    list.appendChild(div);
  });
  goPhase('sub');
}

/* Phase 3: 카드 뽑기 */
function selectSub(sub){
  STATE.subTopic=sub;
  STATE.pool=buildPool(STATE.category.pool);
  STATE.shuffled=shuffle(STATE.pool);
  STATE.drawn=[];
  STATE.drawIdx=0;

  const poolLabel=STATE.category.pool==='major'?'메이저 22장':`메이저 22장 + ${STATE.category.pool.split('+')[1]==='cups'?'컵':STATE.category.pool.split('+')[1]==='swords'?'소드':'펜타클'} 14장`;
  document.getElementById('draw-badge').textContent='✧ '+poolLabel;
  renderProgress();
  updateInstruction();
  renderSpread();
  goPhase('draw');
}

function renderProgress(){
  const el=document.getElementById('draw-progress');
  if(STATE.subTopic.count<=1){el.innerHTML='';return;}
  let html='';
  for(let i=0;i<STATE.subTopic.count;i++){
    const cls=i<STATE.drawIdx?'dot filled':i===STATE.drawIdx?'dot current':'dot';
    html+=`<div class="${cls}" title="${STATE.subTopic.positions[i]}"></div>`;
  }
  el.innerHTML=html;
}

function updateInstruction(){
  const pos=STATE.subTopic.positions[STATE.drawIdx];
  if(STATE.subTopic.count===1){
    document.getElementById('draw-instruction').innerHTML=`🔮 마음을 가다듬고 끌리는 카드 <strong>하나</strong>를 선택하세요`;
  } else {
    document.getElementById('draw-instruction').innerHTML=`🔮 <strong>${STATE.drawIdx+1}번째 카드</strong>를 선택하세요 — <em style="color:var(--accent2)">${pos}</em>`;
  }
}

function renderSpread(){
  const el=document.getElementById('spread');
  el.innerHTML='';
  STATE.shuffled.forEach((c,i)=>{
    const div=document.createElement('div');
    div.className='tcard';
    div.dataset.idx=i;
    div.innerHTML=`<div class="tcard-inner"><div class="tcard-face tcard-back"></div><div class="tcard-face tcard-front"><img class="card-img" src="${getCardImage(c)}" alt="${c.nameKo}" loading="lazy"><div class="card-label">${c.nameKo}</div></div></div>`;
    div.addEventListener('click',()=>pickCard(i));
    el.appendChild(div);
  });
}

function pickCard(idx){
  const card=STATE.shuffled[idx];
  if(STATE.drawn.find(d=>d.card.id===card.id)) return;

  STATE.drawn.push({card, position:STATE.subTopic.positions[STATE.drawIdx]});
  STATE.drawIdx++;

  const cards=document.querySelectorAll('.tcard');
  cards[idx].classList.add('flipped','chosen');
  renderProgress();

  if(STATE.drawIdx>=STATE.subTopic.count){
    setTimeout(()=>{
      cards.forEach((el)=>{
        if(!el.classList.contains('chosen')) el.classList.add('dimmed');
      });
    },300);
    setTimeout(()=>showResults(),1200);
  } else {
    setTimeout(()=>{
      updateInstruction();
      cards[idx].style.opacity='0.5';
      cards[idx].style.pointerEvents='none';
    },800);
  }
}

/* ══════════════════════════════════════════════════════════════════
   Phase 4: 3축 결과 표시
   ══════════════════════════════════════════════════════════════════ */
function showResults(){
  const ctx=STATE.category.context||'general';
  document.getElementById('result-title').textContent=STATE.category.icon+' '+STATE.subTopic.name;
  document.getElementById('result-sub-desc').textContent=STATE.subTopic.desc;

  const container=document.getElementById('result-cards');
  container.innerHTML='';

  STATE.drawn.forEach(({card, position},i)=>{
    const reading=generateReading(card, position, ctx);
    const div=document.createElement('div');
    div.className='result-card';
    div.style.animationDelay=i*0.15+'s';
    div.innerHTML=`
      <div class="position-label">✦ ${position}</div>
      <div class="result-hero">
        <div class="result-visual">
          <img class="result-card-img" src="${getCardImage(card)}" alt="${card.nameKo}">
        </div>
        <div class="result-info">
          <div class="result-num">${card.isMajor?'메이저 아르카나 #'+card.id:card.name}</div>
          <h3>${card.nameKo}</h3>
          ${card.archetype&&card.archetype.length?`<div class="result-archetype">${card.archetype.map(a=>`<span>${a}</span>`).join('')}</div>`:''}
        </div>
      </div>
      ${reading.hint?`<p class="position-nuance">✧ ${reading.hint}</p>`:''}
      <p class="result-desc">${reading.meaning}</p>
      <div class="result-advice">
        <strong>✦ ${position}에서의 조언</strong><br>
        ${reading.advice}
      </div>
    `;
    container.appendChild(div);
  });

  // 종합 리딩
  const summary=document.getElementById('summary-panel');
  if(STATE.drawn.length>=2){
    summary.style.display='';
    document.getElementById('summary-text').textContent=buildSummary();
    // 심리적 통찰
    const insightEl=document.getElementById('summary-insight');
    const insight=buildInsight();
    if(insight){
      insightEl.style.display='';
      insightEl.innerHTML='<strong>🔮 심리적 통찰</strong><br>'+insight;
    } else {
      insightEl.style.display='none';
    }
  } else {
    summary.style.display='none';
  }

  goPhase('result');
}

/* 리셋 */
function resetAll(){
  STATE.category=null;STATE.subTopic=null;STATE.pool=[];STATE.drawn=[];STATE.drawIdx=0;
  goPhase('topic');
}
function retrySame(){
  if(!STATE.subTopic) return resetAll();
  selectSub(STATE.subTopic);
}

/* 초기화 */
renderTopics();
</script>
