<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인연결 · 오늘의 타로</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap');
:root{--bg:#0a0a1a;--panel:#12102a;--panel2:#1a1640;--line:#2a2555;--text:#f0eeff;--muted:#9e97c0;--accent:#c9a84c;--accent2:#e8d48b;--warn:#e8a855;--glow:#c9a84c33;--shadow:0 20px 60px #00001088;--glass:rgba(25,20,60,0.65);--glass-border:rgba(200,168,76,0.15)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,#1e1545 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,#15102e 0%,transparent 50%),radial-gradient(circle at 50% 50%,#0d0b20 0%,#0a0a1a 100%);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.7;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.15),transparent),radial-gradient(1px 1px at 30% 60%,rgba(255,255,255,.1),transparent),radial-gradient(1px 1px at 50% 10%,rgba(255,255,255,.12),transparent),radial-gradient(1px 1px at 70% 40%,rgba(255,255,255,.08),transparent),radial-gradient(1px 1px at 90% 80%,rgba(255,255,255,.1),transparent),radial-gradient(1.5px 1.5px at 15% 75%,rgba(201,168,76,.2),transparent),radial-gradient(1.5px 1.5px at 85% 15%,rgba(201,168,76,.15),transparent);pointer-events:none;z-index:0}
.app{max-width:640px;margin:auto;padding:40px 18px 70px;position:relative;z-index:1;text-align:center}
.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1{font-family:"Noto Serif KR",serif;font-size:clamp(28px,5vw,44px);line-height:1.12;margin:14px 0 8px;letter-spacing:-.04em;background:linear-gradient(135deg,#f0eeff 0%,#e8d48b 50%,#f0eeff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── 날짜·인사 ── */
.date-display{color:var(--muted);font-size:14px;margin-bottom:6px}
.greeting{color:var(--accent2);font-size:16px;margin-bottom:32px;font-family:"Noto Serif KR",serif}

/* ── 카드 영역 ── */
.card-stage{perspective:1000px;margin:0 auto 32px;width:180px;height:280px;cursor:pointer}
.card-stage.revealed{cursor:default}
.card-inner{position:relative;width:100%;height:100%;transition:transform 1s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card-stage.revealed .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:18px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
.card-back{background:linear-gradient(145deg,#1e1845,#140f30);border:2px solid rgba(201,168,76,.35);box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 0 40px rgba(201,168,76,.04)}
.card-back-deco{font-size:42px;color:rgba(201,168,76,.2);text-shadow:0 0 30px rgba(201,168,76,.1);animation:pulse 3s ease-in-out infinite}
.card-back-hint{color:var(--muted);font-size:12px;margin-top:12px;opacity:.7}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.card-front{background:linear-gradient(145deg,rgba(201,168,76,.12),rgba(20,15,40,.95));border:2px solid rgba(201,168,76,.5);transform:rotateY(180deg);box-shadow:0 8px 40px rgba(201,168,76,.2),inset 0 0 40px rgba(201,168,76,.05);padding:16px;gap:4px}
.card-front .card-img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.card-front .card-name{display:none}
.card-front .card-name-en{display:none}
.card-front .card-num{display:none}
.card-stage:not(.revealed):hover .card-inner{transform:rotateY(12deg)}

/* ── 결과 ── */
.result{display:none;animation:fadeUp .8s ease}
.result.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.result-panel{background:linear-gradient(160deg,rgba(22,18,50,0.85),rgba(14,12,30,0.9));border:1px solid rgba(201,168,76,.25);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:32px 24px;text-align:left}
.card-stage-row{display:flex;align-items:center;gap:20px;justify-content:center;margin-bottom:16px}
.card-info-side{text-align:left}
.card-info-name{font-family:"Noto Serif KR",serif;font-size:22px;font-weight:700;color:var(--accent2)}
.card-info-name-en{font-size:13px;color:var(--muted);margin-top:4px}
.card-info-num{font-size:11px;color:var(--muted);margin-top:4px}
.result-top{display:flex;gap:24px;align-items:flex-start;margin-bottom:20px}
.result-card-col{flex:0 0 200px;text-align:center}
.result-card-col .result-card-img{width:100%;height:auto;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 20px rgba(201,168,76,.15)}
.result-card-col .result-card-name{font-family:"Noto Serif KR",serif;font-size:18px;font-weight:700;color:var(--accent2);margin-top:10px}
.result-card-col .result-card-name-en{font-size:11px;color:var(--muted);margin-top:2px}
.result-card-col .result-card-num{font-size:10px;color:var(--muted);margin-top:2px}
.result-desc-col{flex:1;min-width:0}

.result-keywords{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;justify-content:center}
.result-keywords span{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--accent2);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600}

.section-label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;margin-bottom:6px;margin-top:20px}
.section-label:first-of-type{margin-top:0}
.msg-text{font-size:15px;line-height:1.9;color:#d8d0f0}

.advice-box{padding:16px 18px;border-radius:14px;background:rgba(77,168,112,.05);border:1px solid rgba(77,168,112,.12);font-size:15px;color:#c8f0d8;line-height:1.8;margin-top:12px}
.advice-box strong{color:#8ee0a8;font-size:12px;letter-spacing:.05em}

.lucky-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.lucky-item{background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.12);border-radius:14px;padding:14px 10px;text-align:center}
.lucky-item .lucky-icon{font-size:22px;margin-bottom:4px}
.lucky-item .lucky-label{font-size:11px;color:var(--muted)}
.lucky-item .lucky-value{font-size:14px;color:var(--accent2);font-weight:700;margin-top:2px}

/* ── 스트릭 ── */
.streak-bar{margin-top:24px;padding:14px 18px;border-radius:14px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.12);display:flex;align-items:center;gap:12px;justify-content:center}
.streak-fire{font-size:22px}
.streak-text{font-size:14px;color:var(--accent2);font-weight:600}
.streak-sub{font-size:12px;color:var(--muted)}

/* ── 버튼·링크 ── */
.btn-row{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 24px;font-weight:700;cursor:pointer;transition:filter .2s,box-shadow .2s;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,#c9a84c,#a88530,#c9a84c);color:#0e0a18;box-shadow:0 4px 20px rgba(201,168,76,.25);text-shadow:0 1px 0 rgba(255,255,255,.2)}
.btn-primary:hover{filter:brightness(1.12);box-shadow:0 6px 30px rgba(201,168,76,.35)}
.btn-ghost{background:rgba(25,20,55,0.6);color:#d0c8f0;border:1px solid #3a3568}
.btn-ghost:hover{border-color:var(--accent)}

.share-row{margin-top:16px;text-align:center}
.share-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;transition:border-color .2s,color .2s}
.share-btn:hover{border-color:var(--accent);color:var(--accent2)}

.back-home{position:fixed;top:16px;left:16px;z-index:100;display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;transition:border-color .2s,color .2s,background .2s}.back-home:hover{border-color:rgba(201,168,76,.4);color:var(--accent2);background:rgba(25,20,60,0.8)}.back-home svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.footer{color:#6a6290;font-size:12px;text-align:center;margin-top:30px;letter-spacing:.02em}

@media(max-width:480px){
  .card-stage{width:150px;height:235px}
  .card-front .card-img{max-height:none}
  .card-front .card-name{font-size:17px}
  .result-panel{padding:22px 16px}
  .card-stage-row{flex-direction:column}
  .lucky-row{grid-template-columns:1fr 1fr 1fr;gap:8px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
/* ── 인연결 Supabase Client ── */
/* ⚠️ 아래 URL과 KEY를 본인의 Supabase 프로젝트 값으로 교체하세요 */
const SUPABASE_URL='__SUPABASE_URL__';
const SUPABASE_KEY='__SUPABASE_ANON_KEY__';

const _sb=(SUPABASE_URL.startsWith('__'))?null:window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const InyeonDB={
  _ready:!!_sb,
  getDeviceId(){
    let id=null;
    try{id=localStorage.getItem('inyeon_device_id')}catch(e){}
    if(!id){
      id=crypto.randomUUID?crypto.randomUUID():
        'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
          const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)});
      try{localStorage.setItem('inyeon_device_id',id)}catch(e){}
    }
    return id;
  },

  async getProfile(){
    if(!_sb)return null;
    const{data,error}=await _sb.from('profiles').select('*')
      .eq('device_id',this.getDeviceId()).single();
    if(error&&error.code!=='PGRST116')console.error('getProfile:',error);
    return data;
  },

  async saveProfile(p){
    if(!_sb)return{data:null,error:{message:'Supabase 미설정'}};
    const{data,error}=await _sb.from('profiles')
      .upsert({...p,device_id:this.getDeviceId(),updated_at:new Date().toISOString()},
        {onConflict:'device_id'}).select().single();
    if(error)console.error('saveProfile:',error);
    return{data,error};
  },

  async deleteProfile(){
    if(!_sb)return false;
    const{error}=await _sb.from('profiles').delete()
      .eq('device_id',this.getDeviceId());
    return !error;
  },

  async saveHistory(entry){
    if(!_sb)return{data:null,error:{message:'Supabase 미설정'}};
    const{data,error}=await _sb.from('history')
      .insert({...entry,device_id:this.getDeviceId()}).select().single();
    if(error)console.error('saveHistory:',error);
    return{data,error};
  },

  async getHistory(type,limit=50){
    if(!_sb)return[];
    let q=_sb.from('history').select('id,content_type,title,input_summary,created_at')
      .eq('device_id',this.getDeviceId()).order('created_at',{ascending:false}).limit(limit);
    if(type)q=q.eq('content_type',type);
    const{data,error}=await q;
    if(error)console.error('getHistory:',error);
    return data||[];
  },

  async getHistoryDetail(id){
    if(!_sb)return null;
    const{data}=await _sb.from('history').select('*')
      .eq('id',id).eq('device_id',this.getDeviceId()).single();
    return data;
  },

  async deleteHistory(id){
    if(!_sb)return false;
    const{error}=await _sb.from('history').delete()
      .eq('id',id).eq('device_id',this.getDeviceId());
    return !error;
  }
};

</script>

/* ── 날짜 기반 시드 → 결정적 카드 선택 ── */
function dateToSeed(dateStr){
  let h=0;
  for(let i=0;i<dateStr.length;i++){h=((h<<5)-h+dateStr.charCodeAt(i))|0;}
  return Math.abs(h);
}

function getTodayStr(){
  const now=new Date();
  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function getCardForDate(dateStr){
  const seed=dateToSeed(dateStr+'inyeongyeol');
  return CARDS[seed%22];
}

function getGreeting(){
  const h=new Date().getHours();
  if(h<6) return '고요한 새벽, 별이 당신에게 속삭여요';
  if(h<12) return '좋은 아침이에요, 오늘 하루를 열어볼까요?';
  if(h<18) return '오후의 햇살 속에서, 잠시 쉬어가세요';
  return '하루를 마무리하며, 내일을 위한 메시지예요';
}

function formatDate(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const days=['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
}

/* ── 스트릭 관리 ── */
function getStreak(){
  try{
    const raw=localStorage.getItem('inyeon_daily_streak');
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){return null;}
}
function saveStreak(data){
  try{localStorage.setItem('inyeon_daily_streak',JSON.stringify(data));}catch(e){}
}
function updateStreak(todayStr){
  const prev=getStreak();
  if(!prev) return saveStreak({lastDate:todayStr,count:1})||1;
  if(prev.lastDate===todayStr) return prev.count;
  // 어제 방문했으면 연속
  const yesterday=new Date(todayStr+'T00:00:00');
  yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toISOString().slice(0,10);
  const count=(prev.lastDate===yStr)? prev.count+1 : 1;
  saveStreak({lastDate:todayStr,count});
  return count;
}

function revealCard(){
  if(revealed) return;
  revealed=true;
  document.getElementById('card-stage').classList.add('revealed');
  // 카드 옆 정보 표시
  document.getElementById('card-info-side').style.display='';
  document.getElementById('ci-name').textContent=todayCard.nameKo;
  document.getElementById('ci-name-en').textContent=todayCard.name;
  document.getElementById('ci-num').textContent=todayCard.id<22?'Major Arcana #'+todayCard.id:todayCard.nameKo;
  try{localStorage.setItem('inyeon_daily_seen',todayStr);}catch(e){}
  setTimeout(()=>showResult(true),600);
}

function showResult(animate){

  document.getElementById('luck-color-icon').textContent=COLOR_ICONS[todayCard.luckyColor]||'🎨';

  const luckyN=(dateToSeed(todayStr)%9)+1;

  // 스트릭
  const streak=updateStreak(todayStr);
  if(streak>1){
    document.getElementById('streak-container').innerHTML=`<div class="streak-bar"><span class="streak-fire">🔥</span><span class="streak-text">${streak}일 연속 방문!</span><span class="streak-sub">꾸준함이 운을 불러와요</span></div>`;
  } else {
    document.getElementById('streak-container').innerHTML=`<div class="streak-bar"><span class="streak-fire">✨</span><span class="streak-text">오늘이 시작이에요</span><span class="streak-sub">매일 방문하면 연속 기록이 쌓여요</span></div>`;
  }

  el.classList.add('show');
  if(animate) el.scrollIntoView({behavior:'smooth',block:'start'});
  if(animate&&typeof InyeonDB!=='undefined'&&InyeonDB._ready){InyeonDB.saveHistory({content_type:'tarot-daily',title:todayCard.nameKo+' · '+formatDate(todayStr),input_summary:todayCard.archetype.join(' · '),result_html:document.querySelector('.result-panel').innerHTML})}
}

function shareResult(){
  const text=`✦ 오늘의 타로 — ${formatDate(todayStr)}\n\n✦ ${todayCard.nameKo} (${todayCard.name})\n\n💬 ${todayCard.message}\n\n✦ 조언: ${todayCard.advice}\n\n🔮 인연결에서 확인하세요`;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{
      const btn=document.querySelector('.share-btn');
      btn.textContent='✅ 복사 완료!';
      setTimeout(()=>{btn.textContent='📋 결과 복사하기';},2000);
    });
  }
}
