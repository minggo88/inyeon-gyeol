<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인연결 · 타로 카드뽑기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap');
:root{--bg:#0a0a1a;--panel:#12102a;--panel2:#1a1640;--line:#2a2555;--text:#f0eeff;--muted:#9e97c0;--accent:#c9a84c;--accent2:#e8d48b;--warn:#e8a855;--glow:#c9a84c33;--shadow:0 20px 60px #00001088;--glass:rgba(25,20,60,0.65);--glass-border:rgba(200,168,76,0.15)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,#1e1545 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,#15102e 0%,transparent 50%),radial-gradient(circle at 50% 50%,#0d0b20 0%,#0a0a1a 100%);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;line-height:1.7;min-height:100vh}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.15),transparent),radial-gradient(1px 1px at 30% 60%,rgba(255,255,255,.1),transparent),radial-gradient(1px 1px at 50% 10%,rgba(255,255,255,.12),transparent),radial-gradient(1px 1px at 70% 40%,rgba(255,255,255,.08),transparent),radial-gradient(1px 1px at 90% 80%,rgba(255,255,255,.1),transparent),radial-gradient(1.5px 1.5px at 15% 75%,rgba(201,168,76,.2),transparent),radial-gradient(1.5px 1.5px at 85% 15%,rgba(201,168,76,.15),transparent);pointer-events:none;z-index:0}
.app{max-width:900px;margin:auto;padding:40px 18px 70px;position:relative;z-index:1;text-align:center}
.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1{font-family:"Noto Serif KR",serif;font-size:clamp(28px,5vw,48px);line-height:1.12;margin:14px 0 12px;letter-spacing:-.04em;background:linear-gradient(135deg,#f0eeff 0%,#e8d48b 50%,#f0eeff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{color:var(--muted);max-width:520px;margin:0 auto 36px;font-size:15px;line-height:1.8}

/* ── 페이즈 공통 ── */
.phase{display:none;animation:fadeUp .5s ease}
.phase.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── 대분류 그리드 ── */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;max-width:600px;margin:0 auto 30px}
.cat-btn{background:linear-gradient(160deg,rgba(22,18,50,0.8),rgba(14,12,30,0.9));border:1.5px solid var(--line);border-radius:16px;padding:20px 10px 16px;cursor:pointer;transition:all .25s;text-align:center}
.cat-btn:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(201,168,76,.12)}
.cat-btn .cat-icon{font-size:32px;display:block;margin-bottom:8px}
.cat-btn .cat-name{font-size:14px;font-weight:700;color:var(--accent2)}
.cat-btn .cat-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}

/* ── 소분류 리스트 ── */
.sub-header{margin-bottom:20px}
.sub-header .back-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:12px;transition:color .2s}
.sub-header .back-btn:hover{color:var(--accent2)}
.sub-header h2{font-family:"Noto Serif KR",serif;font-size:22px;color:var(--accent2);margin:0 0 6px}
.sub-header p{color:var(--muted);font-size:13px;margin:0}
.sub-list{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sub-btn{background:linear-gradient(160deg,rgba(22,18,50,0.7),rgba(14,12,30,0.85));border:1.5px solid var(--line);border-radius:14px;padding:16px 20px;cursor:pointer;transition:all .25s;text-align:left;display:flex;justify-content:space-between;align-items:center}
.sub-btn:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(201,168,76,.1)}
.sub-btn .sub-name{font-size:15px;font-weight:700;color:var(--text)}
.sub-btn .sub-desc{font-size:12px;color:var(--muted);margin-top:2px}
.sub-btn .sub-count{flex:none;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.2);color:var(--accent2);padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}

/* ── 카드 그리드 ── */
.draw-header{margin-bottom:20px}
.draw-header .back-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:8px;transition:color .2s}
.draw-header .back-btn:hover{color:var(--accent2)}
.badge{border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-radius:999px;color:var(--accent2);font-size:12px;font-weight:600;letter-spacing:.03em;display:inline-block;margin-bottom:12px}
.spread{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:36px;perspective:1200px}
.tcard{width:90px;height:140px;cursor:pointer;perspective:800px;transition:transform .3s}
.tcard:hover:not(.flipped){transform:translateY(-6px)}
.tcard.flipped{pointer-events:none}
.tcard-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.tcard.flipped .tcard-inner{transform:rotateY(180deg)}
.tcard-face{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
.tcard-back{background:linear-gradient(145deg,#1e1845,#140f30);border:1.5px solid rgba(201,168,76,.3);box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 0 30px rgba(201,168,76,.04)}
.tcard-back::after{content:'✦';font-size:28px;color:rgba(201,168,76,.25);text-shadow:0 0 20px rgba(201,168,76,.15)}
.tcard-front{background:linear-gradient(145deg,rgba(201,168,76,.12),rgba(20,15,40,.95));border:1.5px solid rgba(201,168,76,.4);transform:rotateY(180deg);box-shadow:0 4px 24px rgba(201,168,76,.15),inset 0 0 30px rgba(201,168,76,.05);padding:8px}
.tcard-front .card-emoji{font-size:32px;margin-bottom:4px}
.tcard-front .card-label{font-size:10px;color:var(--accent2);font-weight:700;text-align:center;line-height:1.2;font-family:"Noto Serif KR",serif}
.tcard.chosen .tcard-front{border-color:rgba(201,168,76,.7);box-shadow:0 0 20px rgba(201,168,76,.3),0 4px 24px rgba(201,168,76,.15),inset 0 0 30px rgba(201,168,76,.05)}
.tcard.dimmed{opacity:.35;pointer-events:none;transform:scale(.92)}
.instruction{color:var(--muted);font-size:14px;margin-bottom:20px}
.instruction strong{color:var(--accent2)}
.draw-progress{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.draw-progress .dot{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .3s}
.draw-progress .dot.filled{background:var(--accent)}
.draw-progress .dot.current{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* ── 결과 섹션 ── */
.result-cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin-bottom:30px}
.result-card{background:linear-gradient(160deg,rgba(22,18,50,0.85),rgba(14,12,30,0.9));border:1px solid rgba(201,168,76,.25);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:24px 20px;text-align:left;width:100%;max-width:360px}
.result-card .position-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.result-card .result-hero{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.result-visual{flex:none;width:80px;height:115px;border-radius:12px;background:linear-gradient(145deg,rgba(201,168,76,.15),rgba(201,168,76,.05));border:2px solid rgba(201,168,76,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 0 30px rgba(201,168,76,.05)}
.result-emoji{font-size:32px;margin-bottom:4px}
.result-name{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:700;color:var(--accent2);text-align:center}
.result-name-en{font-size:10px;color:var(--muted);text-align:center;margin-top:2px}
.result-card .result-info h3{margin:0 0 6px;font-size:18px;color:var(--accent2);font-family:"Noto Serif KR",serif}
.result-card .result-num{font-size:11px;color:var(--muted);margin-bottom:6px}
.result-card .result-archetype{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:0}
.result-card .result-archetype span{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);color:var(--accent2);padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
.result-card .result-desc{font-size:14px;line-height:1.7;color:#d8d0f0;margin:0 0 12px}
.result-card .result-advice{padding:12px 14px;border-radius:10px;background:rgba(77,168,112,.05);border:1px solid rgba(77,168,112,.12);font-size:13px;color:#c8f0d8;line-height:1.6}
.result-card .result-advice strong{color:#8ee0a8;font-size:11px;letter-spacing:.05em}

/* ── 종합 조언 (3장용) ── */
.summary-panel{background:linear-gradient(160deg,rgba(22,18,50,0.85),rgba(14,12,30,0.9));border:1px solid rgba(201,168,76,.3);border-radius:20px;padding:24px;max-width:740px;margin:0 auto 20px;text-align:left}
.summary-panel h3{font-family:"Noto Serif KR",serif;font-size:18px;color:var(--accent2);margin:0 0 10px}
.summary-panel p{font-size:14px;color:#d8d0f0;line-height:1.8;margin:0}

/* ── 버튼 ── */
.btn-row{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 24px;font-weight:700;cursor:pointer;transition:filter .2s,box-shadow .2s;font-size:14px}
.btn-primary{background:linear-gradient(135deg,#c9a84c,#a88530,#c9a84c);color:#0e0a18;box-shadow:0 4px 20px rgba(201,168,76,.25);text-shadow:0 1px 0 rgba(255,255,255,.2)}
.btn-primary:hover{filter:brightness(1.12);box-shadow:0 6px 30px rgba(201,168,76,.35)}
.btn-ghost{background:rgba(25,20,55,0.6);color:#d0c8f0;border:1px solid #3a3568}
.btn-ghost:hover{border-color:var(--accent)}
.home-link{display:inline-block;margin-top:20px;color:var(--muted);font-size:13px;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s,color .2s}
.home-link:hover{color:var(--accent2);border-color:var(--accent2)}
.footer{color:#6a6290;font-size:12px;text-align:center;margin-top:30px;letter-spacing:.02em}

@media(max-width:600px){
  .cat-grid{grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
  .cat-btn{padding:16px 8px 14px}
  .cat-btn .cat-icon{font-size:26px}
  .cat-btn .cat-name{font-size:13px}
  .tcard{width:72px;height:112px}
  .tcard-back::after{font-size:22px}
  .tcard-front .card-emoji{font-size:24px}
  .tcard-front .card-label{font-size:9px}
  .result-card{padding:18px 16px}
  .result-visual{width:68px;height:100px}
  .result-emoji{font-size:26px}
  .result-name{font-size:13px}
  .result-cards{gap:14px}
}
</style>
</head>
<body>
<main class="app">
  <div class="eyebrow">✦ INYEON GYEOL · 인연결</div>
  <h1>타로 카드뽑기</h1>

  <!-- ====== Phase 1: 대분류 선택 ====== -->
  <div class="phase active" id="phase-topic">
    <p class="subtitle">어떤 이야기가 궁금하세요?<br>주제를 선택하면 맞는 카드를 준비해 드릴게요.</p>
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- ====== Phase 2: 소분류 선택 ====== -->
  <div class="phase" id="phase-sub">
    <div class="sub-header">
      <button class="back-btn" onclick="goPhase('topic')">← 주제 다시 선택</button>
      <h2 id="sub-title"></h2>
      <p id="sub-desc"></p>
    </div>
    <div class="sub-list" id="sub-list"></div>
  </div>

  <!-- ====== Phase 3: 카드 뽑기 ====== -->
  <div class="phase" id="phase-draw">
    <div class="draw-header">
      <button class="back-btn" onclick="goPhase('sub')">← 소분류 다시 선택</button>
      <div class="badge" id="draw-badge"></div>
    </div>
    <div class="draw-progress" id="draw-progress"></div>
    <p class="instruction" id="draw-instruction"></p>
    <div class="spread" id="spread"></div>
  </div>

  <!-- ====== Phase 4: 결과 ====== -->
  <div class="phase" id="phase-result">
    <div class="sub-header" style="margin-bottom:24px">
      <h2 id="result-title"></h2>
      <p id="result-sub-desc"></p>
    </div>
    <div class="result-cards" id="result-cards"></div>
    <div class="summary-panel" id="summary-panel" style="display:none">
      <h3>✦ 종합 메시지</h3>
      <p id="summary-text"></p>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="resetAll()">🔮 다른 주제 보기</button>
      <button class="btn btn-ghost" onclick="retrySame()">🔄 같은 주제 다시 뽑기</button>
      <a href="saju-main.html" class="btn btn-ghost">🏠 메인으로</a>
    </div>
  </div>

  <div class="footer">타로 해석은 오락과 자기성찰을 위한 참고 결과이며 의료·법률·투자 판단을 대신하지 않습니다.</div>
</main>

<script>
/* ================================================================
   인연결 타로 SPA — 주제분류 + 멀티카드 스프레드
   ================================================================ */

/* ── 78장 카드 데이터 (인라인) ── */
const MAJOR=[
  {id:0,  name:'The Fool',           nameKo:'바보',           emoji:'🃏', archetype:['자유','시작','모험'],   description:'새로운 시작과 무한한 가능성을 상징해요', advice:'두려워하지 말고 첫 발을 내딛어 보세요', isMajor:true},
  {id:1,  name:'The Magician',       nameKo:'마법사',          emoji:'🎩', archetype:['의지','기술','실현'],   description:'가진 능력을 최대한 발휘할 수 있는 때예요', advice:'지금 가진 걸로 시작하세요, 충분해요', isMajor:true},
  {id:2,  name:'The High Priestess', nameKo:'여사제',          emoji:'🌙', archetype:['직관','지혜','내면'],   description:'내면의 목소리에 귀 기울일 때예요', advice:'조용한 시간이 가장 깊은 답을 줘요', isMajor:true},
  {id:3,  name:'The Empress',        nameKo:'여제',            emoji:'🌿', archetype:['풍요','돌봄','창조'],   description:'풍요롭고 따뜻한 에너지가 흐르고 있어요', advice:'주변을 돌보는 만큼 나에게도 돌아와요', isMajor:true},
  {id:4,  name:'The Emperor',        nameKo:'황제',            emoji:'👑', archetype:['권위','구조','리더십'], description:'체계를 잡고 이끌어가는 힘이 있어요', advice:'흔들리지 않는 원칙이 신뢰를 만들어요', isMajor:true},
  {id:5,  name:'The Hierophant',     nameKo:'교황',            emoji:'📿', archetype:['전통','가르침','신뢰'], description:'배움과 전통에서 답을 찾을 수 있어요', advice:'경험 많은 사람의 조언에 귀 기울여 보세요', isMajor:true},
  {id:6,  name:'The Lovers',         nameKo:'연인',            emoji:'💕', archetype:['선택','관계','조화'],   description:'중요한 선택과 관계의 에너지가 강해요', advice:'마음이 이끄는 방향을 믿어 보세요', isMajor:true},
  {id:7,  name:'The Chariot',        nameKo:'전차',            emoji:'🏇', archetype:['승리','의지','전진'],   description:'강한 의지로 밀고 나갈 수 있는 때예요', advice:'방향을 정했으면 흔들리지 마세요', isMajor:true},
  {id:8,  name:'Strength',           nameKo:'힘',              emoji:'🦁', archetype:['용기','인내','내면의힘'],description:'부드러운 힘이 거친 힘보다 오래가요', advice:'참을성이 가장 강한 무기예요', isMajor:true},
  {id:9,  name:'The Hermit',         nameKo:'은둔자',          emoji:'🏔️', archetype:['성찰','고독','지혜'],   description:'혼자만의 시간이 깊은 깨달음을 줘요', advice:'바쁨에서 한 발 물러나 보세요', isMajor:true},
  {id:10, name:'Wheel of Fortune',   nameKo:'운명의 수레바퀴', emoji:'🎡', archetype:['운명','전환','기회'],   description:'흐름이 바뀌는 전환점에 있어요', advice:'변화를 두려워하지 말고 올라타세요', isMajor:true},
  {id:11, name:'Justice',            nameKo:'정의',            emoji:'⚖️', archetype:['공정','균형','진실'],   description:'공정하고 균형 잡힌 판단이 필요해요', advice:'감정보다 사실을 기준으로 결정하세요', isMajor:true},
  {id:12, name:'The Hanged Man',     nameKo:'매달린 사람',     emoji:'🙃', archetype:['희생','관점전환','기다림'],description:'잠시 멈추면 보이지 않던 것이 보여요', advice:'포기가 아니라 다른 각도로 보는 거예요', isMajor:true},
  {id:13, name:'Death',              nameKo:'죽음',            emoji:'🦋', archetype:['변화','끝과시작','탈피'],description:'끝이 아니라 새로운 시작의 문이에요', advice:'놓아야 할 것을 놓으면 새 공간이 열려요', isMajor:true},
  {id:14, name:'Temperance',         nameKo:'절제',            emoji:'⚗️', archetype:['균형','인내','조화'],   description:'서두르지 않는 것이 가장 빠른 길이에요', advice:'조금씩, 꾸준히, 균형 있게 나아가세요', isMajor:true},
  {id:15, name:'The Devil',          nameKo:'악마',            emoji:'😈', archetype:['집착','유혹','속박'],   description:'무엇에 묶여 있는지 직시할 때예요', advice:'진짜 원하는 것과 습관을 구분하세요', isMajor:true},
  {id:16, name:'The Tower',          nameKo:'탑',              emoji:'⚡', archetype:['붕괴','해방','각성'],   description:'무너지는 것은 더 단단한 것을 세우기 위해서예요', advice:'충격 뒤에 진짜 중요한 것이 남아요', isMajor:true},
  {id:17, name:'The Star',           nameKo:'별',              emoji:'⭐', archetype:['희망','치유','영감'],   description:'어둠 뒤에 찾아오는 희망의 빛이에요', advice:'지금은 쉬면서 자신을 돌봐도 돼요', isMajor:true},

}

/* ── 카드풀 빌더 ── */
function buildPool(poolType){
  if(poolType==='major') return [...MAJOR];
  const parts=poolType.split('+');
  let pool=[...MAJOR];
  if(parts.includes('cups'))      pool=pool.concat(MINOR.filter(c=>c.suit==='cups'));
  if(parts.includes('swords'))    pool=pool.concat(MINOR.filter(c=>c.suit==='swords'));
  if(parts.includes('pentacles')) pool=pool.concat(MINOR.filter(c=>c.suit==='pentacles'));
  if(parts.includes('wands'))     pool=pool.concat(MINOR.filter(c=>c.suit==='wands'));
  return pool;
}

/* ── 셔플 (Fisher–Yates) ── */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ── 페이즈 전환 ── */
function goPhase(p){
  document.querySelectorAll('.phase').forEach(el=>el.classList.remove('active'));
  document.getElementById('phase-'+p).classList.add('active');
  STATE.phase=p;
  window.scrollTo({top:0,behavior:'smooth'});
}

}

  document.getElementById('sub-title').textContent=cat.icon+' '+cat.name;
  document.getElementById('sub-desc').textContent=cat.desc;

  const list=document.getElementById('sub-list');
  list.innerHTML='';
  cat.subs.forEach(s=>{
    const div=document.createElement('div');
    div.className='sub-btn';
    div.innerHTML=`<div><div class="sub-name">${s.name}</div><div class="sub-desc">${s.desc}</div></div><span class="sub-count">${s.count}장</span>`;
    div.addEventListener('click',()=>selectSub(s));
    list.appendChild(div);
  });
  goPhase('sub');
}

/* ── Phase 3: 카드 뽑기 ── */
function selectSub(sub){
  STATE.subTopic=sub;
  STATE.pool=buildPool(STATE.category.pool);
  STATE.shuffled=shuffle(STATE.pool);
  STATE.drawn=[];
  STATE.drawIdx=0;

  // 뱃지
  const poolLabel=STATE.category.pool==='major'?'메이저 22장':`메이저 22장 + ${STATE.category.pool.split('+')[1]==='cups'?'컵':STATE.category.pool.split('+')[1]==='swords'?'소드':'펜타클'} 14장`;
  document.getElementById('draw-badge').textContent='✧ '+poolLabel;

  // 진행 dots
  renderProgress();

  // 안내
  updateInstruction();

  // 카드 배열
  renderSpread();

  goPhase('draw');
}

function renderProgress(){
  const el=document.getElementById('draw-progress');
  if(STATE.subTopic.count<=1){el.innerHTML='';return;}
  let html='';
  for(let i=0;i<STATE.subTopic.count;i++){
    const cls=i<STATE.drawIdx?'dot filled':i===STATE.drawIdx?'dot current':'dot';
    html+=`<div class="${cls}" title="${STATE.subTopic.positions[i]}"></div>`;
  }
  el.innerHTML=html;
}

function updateInstruction(){
  const remaining=STATE.subTopic.count-STATE.drawIdx;
  const pos=STATE.subTopic.positions[STATE.drawIdx];
  if(STATE.subTopic.count===1){
    document.getElementById('draw-instruction').innerHTML=`🔮 마음을 가다듬고 끌리는 카드 <strong>하나</strong>를 선택하세요`;
  } else {
    document.getElementById('draw-instruction').innerHTML=`🔮 <strong>${STATE.drawIdx+1}번째 카드</strong>를 선택하세요 — <em style="color:var(--accent2)">${pos}</em>`;
  }
}

function renderSpread(){
  const el=document.getElementById('spread');
  el.innerHTML='';
  STATE.shuffled.forEach((c,i)=>{
    const div=document.createElement('div');
    div.className='tcard';
    div.dataset.idx=i;
    div.innerHTML=`<div class="tcard-inner"><div class="tcard-face tcard-back"></div><div class="tcard-face tcard-front"><div class="card-emoji">${c.emoji}</div><div class="card-label">${c.nameKo}</div></div></div>`;
    div.addEventListener('click',()=>pickCard(i));
    el.appendChild(div);
  });
}

function pickCard(idx){
  const card=STATE.shuffled[idx];
  // 이미 뽑은 카드 무시
  if(STATE.drawn.find(d=>d.card.id===card.id)) return;

  STATE.drawn.push({card, position:STATE.subTopic.positions[STATE.drawIdx]});
  STATE.drawIdx++;

  // 카드 flip
  const cards=document.querySelectorAll('.tcard');
  cards[idx].classList.add('flipped','chosen');

  // 진행 업데이트
  renderProgress();

  // 뽑기 완료?
  if(STATE.drawIdx>=STATE.subTopic.count){
    // 다 뽑았으면 나머지 dimmed + 결과 이동
    setTimeout(()=>{
      cards.forEach((el,i)=>{
        if(!el.classList.contains('chosen')) el.classList.add('dimmed');
      });
    },300);
    setTimeout(()=>showResults(),1200);
  } else {
    // 다음 카드 안내
    setTimeout(()=>{
      updateInstruction();
      // 뽑은 카드 dim (하지만 보이도록)
      cards[idx].style.opacity='0.5';
      cards[idx].style.pointerEvents='none';
    },800);
  }
}

/* ── Phase 4: 결과 표시 ── */
function showResults(){
  document.getElementById('result-title').textContent=STATE.category.icon+' '+STATE.subTopic.name;
  document.getElementById('result-sub-desc').textContent=STATE.subTopic.desc;

  const container=document.getElementById('result-cards');
  container.innerHTML='';

  STATE.drawn.forEach(({card, position},i)=>{
    const div=document.createElement('div');
    div.className='result-card';
    div.style.animationDelay=i*0.15+'s';
    div.innerHTML=`
      <div class="position-label">✦ ${position}</div>
      <div class="result-hero">
        <div class="result-visual">
          <div class="result-emoji">${card.emoji}</div>
          <div class="result-name">${card.nameKo}</div>
          <div class="result-name-en">${card.name}</div>
        </div>
        <div class="result-info">
          <div class="result-num">${card.isMajor?'메이저 아르카나 #'+card.id:card.name}</div>
          <h3>${card.emoji} ${card.nameKo}</h3>
          ${card.archetype&&card.archetype.length?`<div class="result-archetype">${card.archetype.map(a=>`<span>${a}</span>`).join('')}</div>`:''}
        </div>
      </div>
      <p class="result-desc">${card.description}</p>
      <div class="result-advice">
        <strong>✦ ${position}에서의 조언</strong><br>
        ${card.advice}
      </div>
    `;
    container.appendChild(div);
  });

  // 3장 이상이면 종합 메시지
  const summary=document.getElementById('summary-panel');
  if(STATE.drawn.length>=3){
    summary.style.display='';
    document.getElementById('summary-text').textContent=buildSummary();
  } else {
    summary.style.display='none';
  }

  goPhase('result');
}

/* 종합 메시지 생성 (간단 조합) */
function buildSummary(){
  const cards=STATE.drawn.map(d=>d.card);
  const majorCount=cards.filter(c=>c.isMajor).length;

  let msg='';
  if(majorCount===cards.length){
    msg='모든 카드가 메이저 아르카나로 나왔어요. 지금 이 질문은 당신의 인생에서 큰 의미를 가지는 흐름 속에 있어요. ';
  } else if(majorCount>=2){
    msg='메이저 카드가 다수 등장했어요. 중요한 전환점에 가까이 있다는 신호예요. ';
  }

  // 첫 카드 → 시작, 마지막 카드 → 결론
  msg+=`시작점에서 '${cards[0].nameKo}'의 에너지가 흐르고, `;
  if(cards.length===3){
    msg+=`중심에는 '${cards[1].nameKo}'가 자리하며, `;
  }
  msg+=`결론으로 '${cards[cards.length-1].nameKo}'가 방향을 알려주고 있어요. `;
  msg+=cards[cards.length-1].advice;

  return msg;
}

/* ── 리셋 ── */
function resetAll(){
  STATE.category=null;
  STATE.subTopic=null;
  STATE.pool=[];
  STATE.drawn=[];
  STATE.drawIdx=0;
  goPhase('topic');
}

function retrySame(){
  if(!STATE.subTopic) return resetAll();
  selectSub(STATE.subTopic);
}

/* ── 초기화 ── */
renderTopics();
</script>
